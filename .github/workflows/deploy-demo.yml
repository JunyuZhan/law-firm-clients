name: Deploy Demo to GitHub Pages

# 构建前端体验 Demo（MSW Mock 后端，无需真实后端）并发布到 GitHub Pages。
# 触发：手动，以及推送到 demo 分支时自动构建发布。
on:
  push:
    branches: [ demo ]
  workflow_dispatch:

# 授予 GITHUB_TOKEN 发布 Pages 所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个 Pages 部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      - name: Build demo (MSW mock mode)
        working-directory: frontend
        env:
          VITE_DEMO_MODE: 'true'
        run: pnpm build --mode demo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
